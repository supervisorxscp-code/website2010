<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel Chạy Nhảy Vui Vẻ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    :root {
      --bg1: #ffb3c1;
      --bg2: #8ec5fc;
      --bg3: #e0c3fc;
      --panel: rgba(255,255,255,0.85);
      --panel-border: rgba(255,255,255,0.95);
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3));
      font-family: "Press Start 2P", "VT323", monospace;
      color: #2d2d2d;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(255,255,255,0.7));
      border: 5px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
      max-width: 640px;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 2px 2px #fff;
      color: #ff3b6a;
      text-align: center;
    }
    .sub {
      font-size: 12px;
      text-align: center;
      color: #4a4a4a;
    }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      padding: 6px 10px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
    #c {
      image-rendering: pixelated;
      width: min(95vw, 540px);
      height: auto;
      background: #1b1b2f;
      border: 8px solid #fff;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    #c:active { transform: translateY(2px); box-shadow: 0 10px 24px rgba(0,0,0,0.28); }
    .hint {
      text-align: center;
      color: #2d2d2d;
      font-size: 12px;
      text-shadow: 1px 1px #fff;
      line-height: 1.4;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrapper">
    <h1>Pixel Run &amp; Smile</h1>
    <div class="sub">Nhảy qua chướng ngại vật, gom sao, phá kỷ lục cá nhân!</div>
    <div class="meta-row">
      <div class="chip">Space/Chạm: Nhảy</div>
      <div class="chip">R: Chơi lại</div>
      <div class="chip">Điểm +1 khi vượt chướng ngại</div>
      <div class="chip">Sao +3 điểm</div>
    </div>
    <canvas id="c" width="320" height="180" aria-label="pixel runner game"></canvas>
    <div class="hint">Mẹo: Nhấn giữ nhẹ để nhảy nhanh, nhấp lại trên không không được đâu! Canh nhịp để lấy ⭐ an toàn.</div>
  </div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;

const state = {
  running: false,
  gameOver: false,
  score: 0,
  best: 0,
  frame: 0,
  speed: 2,
};

const player = {
  x: 40,
  y: 140,
  w: 14,
  h: 14,
  vy: 0,
  jumping: false,
};

const floorY = 150;
const obstacles = [];
const stars = [];
const sparkles = [];
let obstacleTimer = 60;
let starTimer = 180;

const colors = {
  sky: '#1b1b2f',
  ground: '#2d2d44',
  accent: '#ffda79',
  danger: '#ff6584',
  star: '#8df0ff',
  hill: '#23374d',
};

function loadBest() {
  const saved = Number(localStorage.getItem('pixel-run-best') || 0);
  if (!Number.isNaN(saved)) state.best = saved;
}

function persistBest() {
  localStorage.setItem('pixel-run-best', state.best);
}

function reset() {
  state.running = false;
  state.gameOver = false;
  state.score = 0;
  state.frame = 0;
  state.speed = 2;
  player.y = floorY - player.h;
  player.vy = 0;
  player.jumping = false;
  obstacles.length = 0;
  stars.length = 0;
  sparkles.length = 0;
  obstacleTimer = 50 + Math.floor(Math.random() * 40);
  starTimer = 160 + Math.floor(Math.random() * 80);
}

function snap(n) { return Math.round(n); }

function spawnObstacle() {
  const height = 14 + Math.floor(Math.random() * 16);
  const width = 12 + Math.floor(Math.random() * 10);
  obstacles.push({ x: c.width + width, w: width, h: height, passed: false });
}

function spawnStar() {
  const y = 72 + Math.random() * 48;
  const r = 4;
  stars.push({ x: c.width + 10, y: snap(y), r, w: r, h: r, collected: false });
}

function addSparkle(x, y, color) {
  for (let i = 0; i < 6; i++) {
    sparkles.push({ x, y, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, life: 20, color });
  }
}

function drawGrid() {
  ctx.fillStyle = colors.sky;
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.strokeStyle = '#24243e';
  ctx.lineWidth = 1;
  for (let x = 0; x < c.width; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, c.height); ctx.stroke();
  }
  for (let y = 0; y < c.height; y += 16) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5); ctx.lineTo(c.width, y + 0.5); ctx.stroke();
  }
}

function drawGround() {
  ctx.fillStyle = colors.hill;
  ctx.fillRect(0, floorY - 12, c.width, 16);
  ctx.fillStyle = colors.ground;
  ctx.fillRect(0, floorY, c.width, c.height - floorY);
  ctx.fillStyle = '#353552';
  for (let x = 0; x < c.width; x += 16) {
    ctx.fillRect(x, floorY, 8, 6);
  }
}

function drawPlayer() {
  ctx.fillStyle = colors.accent;
  ctx.fillRect(snap(player.x), snap(player.y), player.w, player.h);
  ctx.fillStyle = '#2d2d2d';
  ctx.fillRect(snap(player.x + player.w - 5), snap(player.y + 4), 3, 3);
  ctx.fillStyle = '#ff9f1c';
  ctx.fillRect(snap(player.x), snap(player.y + player.h - 4), player.w, 4);
}

function drawObstacles() {
  ctx.fillStyle = colors.danger;
  obstacles.forEach(o => {
    ctx.fillRect(snap(o.x), snap(floorY - o.h), o.w, o.h);
    ctx.fillStyle = '#ff8aa7';
    ctx.fillRect(snap(o.x), snap(floorY - o.h), o.w, 4);
    ctx.fillStyle = colors.danger;
  });
}

function drawStars() {
  ctx.fillStyle = colors.star;
  stars.forEach(s => {
    ctx.fillRect(snap(s.x), snap(s.y), s.r, s.r);
  });
}

function drawSparkles() {
  sparkles.forEach(s => {
    ctx.fillStyle = s.color;
    ctx.fillRect(snap(s.x), snap(s.y), 2, 2);
  });
}

function drawUI() {
  ctx.fillStyle = '#fff';
  ctx.font = '12px "Press Start 2P", monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(`Điểm: ${state.score}`, 8, 6);
  ctx.fillText(`Kỷ lục: ${state.best}`, 8, 20);

  if (!state.running && !state.gameOver) {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('Chạm hoặc nhấn Space để chơi', c.width/2, c.height/2 - 14);
    ctx.fillText('Tránh khối đỏ, gom ⭐ để cộng điểm', c.width/2, c.height/2 + 4);
    ctx.textAlign = 'left';
  }

  if (state.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', c.width/2, c.height/2 - 20);
    ctx.fillText(`Điểm: ${state.score}`, c.width/2, c.height/2);
    ctx.fillText('Chạm/Space hoặc R để chơi lại', c.width/2, c.height/2 + 20);
    ctx.textAlign = 'left';
  }
}

function physics() {
  player.vy += 0.45;
  player.y += player.vy;
  if (player.y + player.h >= floorY) {
    player.y = floorY - player.h;
    player.vy = 0;
    player.jumping = false;
  }
}

function updateObstacles() {
  obstacles.forEach(o => {
    o.x -= state.speed;
    if (!o.passed && o.x + o.w < player.x) {
      o.passed = true;
      state.score += 1;
      if (state.score % 6 === 0) state.speed += 0.2;
    }
  });
  while (obstacles.length && obstacles[0].x + obstacles[0].w < -10) obstacles.shift();
}

function updateStars() {
  stars.forEach(s => {
    s.x -= state.speed * 1.1;
    if (!s.collected && collide(player, s)) {
      s.collected = true;
      state.score += 3;
      addSparkle(s.x, s.y, colors.star);
    }
  });
  while (stars.length && (stars[0].x < -20 || stars[0].collected)) stars.shift();
}

function updateSparkles() {
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.life <= 0) sparkles.splice(i,1);
  }
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function checkCollisions() {
  for (const o of obstacles) {
    const box = { x: o.x, y: floorY - o.h, w: o.w, h: o.h };
    if (collide(player, box)) {
      state.gameOver = true;
      state.best = Math.max(state.best, state.score);
      persistBest();
      addSparkle(player.x + player.w/2, player.y + player.h/2, colors.danger);
      return;
    }
  }
}

function jump() {
  if (state.gameOver) return;
  if (!state.running) state.running = true;
  if (!player.jumping) {
    player.vy = -6.8;
    player.jumping = true;
  }
}

function loop() {
  ctx.clearRect(0,0,c.width,c.height);
  drawGrid();
  drawGround();

  if (state.running && !state.gameOver) {
    state.frame++;
    physics();
    obstacleTimer--;
    starTimer--;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      obstacleTimer = Math.max(32, 58 - Math.floor(state.frame / 600) * 4) + Math.floor(Math.random() * 24);
    }
    if (starTimer <= 0) {
      spawnStar();
      starTimer = 140 + Math.floor(Math.random() * 120);
    }
    updateObstacles();
    updateStars();
    updateSparkles();
    checkCollisions();
  }

  drawObstacles();
  drawStars();
  drawSparkles();
  drawPlayer();
  drawUI();

  requestAnimationFrame(loop);
}

function handleAction() {
  if (state.gameOver) {
    reset();
    return;
  }
  jump();
}

c.addEventListener('click', handleAction);
c.addEventListener('touchstart', e => { e.preventDefault(); handleAction(); }, { passive: false });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); handleAction(); }
  if (e.key === 'r' || e.key === 'R') reset();
});

loadBest();
reset();
loop();
</script>
</body>
</html>
